<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f0f0f);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 12px;
    }
    #search {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #fff);
      font-size: 16px;
      margin-bottom: 16px;
    }
    .track {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      cursor: pointer;
    }
    .track:active {
      opacity: 0.7;
    }
    .track img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      margin-right: 12px;
      object-fit: cover;
    }
    .track-info {
      flex: 1;
    }
    .track-title {
      font-weight: 500;
    }
    .track-artist {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 2px;
    }
    #player-container {
      margin-top: 16px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #player-container iframe {
      width: 100%;
      height: 200px;
      border: none;
    }
    .placeholder {
      text-align: center;
      opacity: 0.5;
      margin-top: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Поиск музыки..." />
  <div id="results"></div>
  <div id="player-container"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const searchInput = document.getElementById('search');
    const resultsDiv = document.getElementById('results');
    const playerContainer = document.getElementById('player-container');

    // Временные демо-данные (потом заменим на реальный поиск)
    const demoTracks = [
      { title: "Оставь их", artist: "Scriptonite", videoId: "dQw4w9WgXcQ" },
      { title: "Космос", artist: "МакSим", videoId: "9bZkp7q19f0" },
      { title: "Я свободен", artist: "КиШ", videoId: "kJQP7kiw5Fk" },
    ];

    function renderResults(tracks) {
      if (!tracks.length) {
        resultsDiv.innerHTML = '<div class="placeholder">Ничего не найдено</div>';
        return;
      }
      resultsDiv.innerHTML = tracks.map(track => `
        <div class="track" onclick="playTrack('${track.videoId}')">
          <img src="https://i.ytimg.com/vi/${track.videoId}/hqdefault.jpg" alt="">
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
        </div>
      `).join('');
    }

    function playTrack(videoId) {
      playerContainer.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      `;
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        resultsDiv.innerHTML = '';
        playerContainer.innerHTML = '';
        return;
      }
      const filtered = demoTracks.filter(t => 
        t.title.toLowerCase().includes(query) || 
        t.artist.toLowerCase().includes(query)
      );
      renderResults(filtered);
    });

    // Показываем демо при загрузке
    renderResults(demoTracks);
  </script>
</body>
</html>
