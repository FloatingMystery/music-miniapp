<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f0f0f);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 12px;
    }
    #search {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #fff);
      font-size: 16px;
      margin-bottom: 16px;
    }
    .track {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      cursor: pointer;
    }
    .track:active { opacity: 0.7; }
    .track-info { flex: 1; }
    .track-title { font-weight: 500; }
    .track-artist { font-size: 13px; opacity: 0.7; margin-top: 2px; }
    #player-container {
      margin-top: 16px;
      border-radius: 12px;
      overflow: hidden;
      min-height: 166px;
    }
    .placeholder {
      text-align: center;
      opacity: 0.5;
      margin-top: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Поиск музыки (SoundCloud)..." />
  <div id="results"></div>
  <div id="player-container"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const searchInput = document.getElementById('search');
    const resultsDiv = document.getElementById('results');
    const playerContainer = document.getElementById('player-container');

    let searchTimeout;

    // Простой поиск через SoundCloud (используем публичный виджет)
    async function searchSoundCloud(query) {
      if (!query.trim()) {
        resultsDiv.innerHTML = '';
        playerContainer.innerHTML = '';
        return;
      }

      resultsDiv.innerHTML = '<div class="placeholder">Ищу...</div>';

      // Формируем прямую ссылку на поиск SoundCloud
      const searchUrl = `https://soundcloud.com/search?q=${encodeURIComponent(query)}`;
      
      // Показываем кнопку перехода + пробуем встроить популярный трек по запросу
      resultsDiv.innerHTML = `
        <div class="track" onclick="openSearch('${query}')">
          <div class="track-info">
            <div class="track-title">Искать «${query}» на SoundCloud</div>
            <div class="track-artist">Нажми, чтобы открыть результаты</div>
          </div>
        </div>
      `;

      // Пробуем загрузить плеер с поисковым запросом
      loadPlayer(query);
    }

    function openSearch(query) {
      const url = `https://soundcloud.com/search/sounds?q=${encodeURIComponent(query)}`;
      tg.openLink(url);
    }

    function loadPlayer(query) {
      // SoundCloud не даёт нормальный поиск через эмбед без API,
      // поэтому показываем плеер с возможностью открыть полный поиск
      playerContainer.innerHTML = `
        <div style="background:#1c1c1e; border-radius:12px; padding:16px; text-align:center;">
          <div style="margin-bottom:12px; opacity:0.8;">Плеер SoundCloud</div>
          <iframe 
            width="100%" 
            height="166" 
            scrolling="no" 
            frameborder="no" 
            allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false">
          </iframe>
          <div style="margin-top:12px; font-size:13px; opacity:0.6;">
            Для полного поиска нажми на результат выше
          </div>
        </div>
      `;
    }

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      searchTimeout = setTimeout(() => searchSoundCloud(query), 600);
    });
  </script>
</body>
</html>
