<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Music Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f0f0f);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 12px;
    }
    #search {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #fff);
      font-size: 16px;
      margin-bottom: 16px;
    }
    .track {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      cursor: pointer;
    }
    .track:active { opacity: 0.7; }
    .track img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      margin-right: 12px;
      object-fit: cover;
    }
    .track-info { flex: 1; }
    .track-title { font-weight: 500; }
    .track-artist { font-size: 13px; opacity: 0.7; margin-top: 2px; }
    #player-container {
      margin-top: 16px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #player-container iframe {
      width: 100%;
      height: 200px;
      border: none;
    }
    .placeholder {
      text-align: center;
      opacity: 0.5;
      margin-top: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Поиск музыки..." />
  <div id="results"></div>
  <div id="player-container"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_KEY = "AIzaSyAjWf7fCaJrnv1bCh3UzSsK5ZStdz9RaTQ";
    const searchInput = document.getElementById('search');
    const resultsDiv = document.getElementById('results');
    const playerContainer = document.getElementById('player-container');

    let searchTimeout;

    async function searchYouTube(query) {
      if (!query.trim()) {
        resultsDiv.innerHTML = '';
        return;
      }

      resultsDiv.innerHTML = '<div class="placeholder">Ищу...</div>';

      try {
        // videoEmbeddable=true — только видео, которые можно встраивать
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=15&q=${encodeURIComponent(query)}&key=${API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          resultsDiv.innerHTML = `<div class="placeholder">Ошибка: ${data.error.message}</div>`;
          return;
        }

        const tracks = data.items
          .filter(item => item.id && item.id.videoId)
          .map(item => ({
            title: item.snippet.title,
            artist: item.snippet.channelTitle,
            videoId: item.id.videoId,
            thumbnail: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default.url
          }));

        renderResults(tracks);
      } catch (e) {
        resultsDiv.innerHTML = '<div class="placeholder">Ошибка сети</div>';
      }
    }

    function renderResults(tracks) {
      if (!tracks.length) {
        resultsDiv.innerHTML = '<div class="placeholder">Ничего не найдено</div>';
        return;
      }
      resultsDiv.innerHTML = tracks.map(track => `
        <div class="track" onclick="playTrack('${track.videoId}')">
          <img src="${track.thumbnail}" alt="">
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
        </div>
      `).join('');
    }

    function playTrack(videoId) {
      playerContainer.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;
    }

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      if (!query) {
        resultsDiv.innerHTML = '';
        playerContainer.innerHTML = '';
        return;
      }
      searchTimeout = setTimeout(() => searchYouTube(query), 600);
    });
  </script>
</body>
</html>
